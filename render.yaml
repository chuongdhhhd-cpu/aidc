services:
  - type: web
    name: acdi-check-backend
    runtime: python
    plan: starter
    region: singapore
    buildCommand: python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /health
    disk:
      name: acdi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ACDI_HOST
        value: 0.0.0.0
      - key: ACDI_DB_PATH
        value: /var/data/acdi.sqlite3
      - key: ACDI_MIN_GROUP_SIZE
        value: "5"
