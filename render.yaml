services:
  - type: web
    name: acdi-check-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: python3 -m pip install -r requirements.txt && python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ACDI_ADMIN_TOKEN
        sync: false
      - key: ACDI_HOST
        value: 0.0.0.0
      - key: ACDI_MIN_GROUP_SIZE
        value: "1"
      - key: ACDI_KEEPALIVE
        value: "1"
      - key: ACDI_KEEPALIVE_INTERVAL
        value: "600"
